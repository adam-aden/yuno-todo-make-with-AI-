<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Yuno To-Do Companion</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        }

        body {
            background-color: #0f0f14;
            color: #ffffff;
            padding-top: 170px; /* เว้นพื้นที่ด้านบนไม่ให้ To-Do List โดนกล่องลอยทับ */
            padding-bottom: 30px;
        }

        /* ------------------------------------
           1. ส่วนตัวละคร + กล่องข้อความ ลอยติดจอ (FIXED HEADER)
        ------------------------------------ */
        #fixed-widget {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 160px;
            background-color: #0f0f14;
            z-index: 9999;
            display: flex;
            align-items: center;
            padding: 10px;
            border-bottom: 1px solid #2a2a38;
            box-shadow: 0px 4px 15px rgba(0,0,0,0.5);
        }

        /* ตัวละครย่อขนาดไว้อยู่มุมซ้าย */
        .char-container {
            width: 110px;
            height: 140px;
            display: flex;
            justify-content: center;
            align-items: flex-end;
            flex-shrink: 0;
        }

        .char-container img {
            max-width: 100%;
            max-height: 100%;
            object-fit: contain;
        }

        /* กล่องข้อความอยู่ทางขวา */
        .dialogue-wrapper {
            flex-grow: 1;
            margin-left: 10px;
            display: flex;
            flex-direction: column;
            gap: 5px;
        }

        .chat-bubble {
            background-color: rgba(30, 30, 45, 0.9);
            border: 2px solid #8c7ae6;
            border-radius: 12px;
            padding: 10px;
            min-height: 85px;
            position: relative;
            transition: background-color 0.2s;
        }

        .chat-bubble::before {
            content: '';
            position: absolute;
            left: -8px;
            top: 50%;
            transform: translateY(-50%);
            border-width: 6px 8px 6px 0;
            border-style: solid;
            border-color: transparent #8c7ae6 transparent transparent;
        }

        .char-name {
            font-size: 11px;
            color: #d6a2e8;
            font-weight: bold;
        }

        .dialogue-text {
            font-size: 13px;
            color: #ffffff;
            margin-top: 3px;
            line-height: 1.3;
        }

        /* แถบปรับ Opacity */
        .opacity-control {
            display: flex;
            align-items: center;
            gap: 8px;
            font-size: 11px;
            color: #aaa;
        }

        .opacity-control input {
            flex-grow: 1;
            accent-color: #8c7ae6;
        }

        /* ------------------------------------
           2. แถบปุ่มกดเลือกโหมด (ซ้าย-ขวา)
        ------------------------------------ */
        .nav-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 10px 15px;
            background-color: #181824;
            margin: 10px 15px;
            border-radius: 10px;
        }

        .nav-btn {
            background-color: #8c7ae6;
            color: white;
            border: none;
            padding: 6px 12px;
            border-radius: 6px;
            font-size: 12px;
            font-weight: bold;
            cursor: pointer;
        }

        .nav-title {
            font-size: 14px;
            font-weight: bold;
            color: #e0e0e0;
        }

        /* ------------------------------------
           3. ส่วนเนื้อหา To-Do List
        ------------------------------------ */
        .content-area {
            padding: 0 15px;
        }

        .input-group {
            display: flex;
            gap: 8px;
            margin-bottom: 15px;
        }

        .input-group input {
            flex-grow: 1;
            padding: 12px;
            border-radius: 8px;
            border: 1px solid #333;
            background-color: #1a1a26;
            color: white;
            font-size: 14px;
        }

        .input-group button {
            background-color: #44bd32;
            color: white;
            border: none;
            padding: 0 16px;
            border-radius: 8px;
            font-size: 18px;
            font-weight: bold;
            cursor: pointer;
        }

        .task-list {
            list-style: none;
        }

        .task-item {
            background-color: #1a1a26;
            border-radius: 8px;
            padding: 12px;
            margin-bottom: 8px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            border-left: 4px solid #8c7ae6;
        }

        .task-item.done span {
            text-decoration: line-through;
            color: #777;
        }

        .task-left {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .task-left input[type="checkbox"] {
            width: 18px;
            height: 18px;
            accent-color: #44bd32;
        }

        .del-btn {
            background: none;
            border: none;
            font-size: 16px;
            cursor: pointer;
        }
    </style>
</head>
<body>

    <!-- 1. ส่วนหัวลอยติดจอคงที่ -->
    <div id="fixed-widget">
        <div class="char-container">
            <img id="char-img" src="static/idle.png" alt="Character">
        </div>
        <div class="dialogue-wrapper">
            <div class="chat-bubble" id="chat-box">
                <div class="char-name">Yuno</div>
                <div class="dialogue-text" id="dialogue-text">สวัสดีค่ะ! วันนี้มีอะไรให้ฉันช่วยจดไหมคะ?</div>
            </div>
            <div class="opacity-control">
                <span>ความใส:</span>
                <input type="range" id="opacity-slider" min="0.2" max="1" step="0.05" value="0.9" oninput="changeOpacity(this.value)">
            </div>
        </div>
    </div>

    <!-- 2. แถบเลือกโหมด ซ้าย-ขวา -->
    <div class="nav-bar">
        <button class="nav-btn" onclick="prevMode()">◀️ ก่อนหน้า</button>
        <span class="nav-title" id="mode-title">📋 To-Do List</span>
        <button class="nav-btn" onclick="nextMode()">ถัดไป ▶️</button>
    </div>

    <!-- 3. พื้นที่เนื้อหาหลัก -->
    <div class="content-area">
        <!-- โหมด To-Do List -->
        <div id="todo-section">
            <div class="input-group">
                <input type="text" id="task-input" placeholder="พิมพ์รายการสิ่งที่ต้องทำ...">
                <button onclick="addTask()">^</button>
            </div>
            <ul class="task-list" id="task-list"></ul>
        </div>

        <!-- โหมด แผ่นดินไหว -->
        <div id="earthquake-section" style="display: none; text-align: center; padding: 20px;">
            <button class="nav-btn" style="padding: 12px 20px; font-size: 14px;" onclick="checkEarthquake()">🌐 ดึงข้อมูลแผ่นดินไหวล่าสุด</button>
        </div>
    </div>

    <script>
        const modes = ["📋 To-Do List", "🌐 แผ่นดินไหว"];
        let currentModeIdx = 0;
        let tasks = [];
        let praiseTimer = null;

        // รูปภาพ
        const IMG_IDLE = "static/idle.png";
        const IMG_PRAISE = "static/praise.png";
        const IMG_ALERT = "static/alert.png";

        function changeOpacity(val) {
            document.getElementById('chat-box').style.backgroundColor = `rgba(30, 30, 45, ${val})`;
        }

        function setDialogue(text, imgPath) {
            document.getElementById('dialogue-text').innerText = text;
            if(imgPath) {
                document.getElementById('char-img').src = imgPath;
            }
        }

        function updateModeUI() {
            document.getElementById('mode-title').innerText = modes[currentModeIdx];
            if (currentModeIdx === 0) {
                document.getElementById('todo-section').style.display = 'block';
                document.getElementById('earthquake-section').style.display = 'none';
            } else {
                document.getElementById('todo-section').style.display = 'none';
                document.getElementById('earthquake-section').style.display = 'block';
                checkEarthquake();
            }
        }

        function prevMode() {
            currentModeIdx = (currentModeIdx - 1 + modes.length) % modes.length;
            updateModeUI();
        }

        function nextMode() {
            currentModeIdx = (currentModeIdx + 1) % modes.length;
            updateModeUI();
        }

        // ระบบ To-Do List
        function addTask() {
            const input = document.getElementById('task-input');
            const val = input.value.trim();
            if (val) {
                tasks.push({ text: val, done: false });
                input.value = '';
                renderTasks();
                setDialogue(`จดรายการ "${val}" เรียบร้อยแล้วค่ะ!`, IMG_IDLE);
            }
        }

        function toggleTask(idx) {
            tasks[idx].done = !tasks[idx].done;
            renderTasks();

            if (tasks[idx].done) {
                setDialogue("เก่งมากเลยค่ะ! ทำสำเร็จไปอีกอย่างแล้วนะ 👍✨", IMG_PRAISE);
                
                // ค้างภาพชูนิ้วยิ้มไว้ 3 วินาที แล้วกลับสู่ท่าปกติ
                clearTimeout(praiseTimer);
                praiseTimer = setTimeout(() => {
                    setDialogue("สู้ๆ กับงานที่เหลือต่อนะคะ!", IMG_IDLE);
                }, 3000);
            } else {
                setDialogue("ยกเลิกการเช็คแล้ว สู้ๆ นะคะ", IMG_IDLE);
            }
        }

        function deleteTask(idx) {
            const removed = tasks.splice(idx, 1);
            renderTasks();
            setDialogue(`ลบรายการ "${removed[0].text}" แล้วค่ะ`, IMG_IDLE);
        }

        function renderTasks() {
            const listEl = document.getElementById('task-list');
            listEl.innerHTML = '';
            tasks.forEach((task, idx) => {
                const li = document.createElement('li');
                li.className = `task-item ${task.done ? 'done' : ''}`;
                li.innerHTML = `
                    <div class="task-left">
                        <input type="checkbox" ${task.done ? 'checked' : ''} onchange="toggleTask(${idx})">
                        <span>${task.text}</span>
                    </div>
                    <button class="del-btn" onclick="deleteTask(${idx})">🗑️</button>
                `;
                listEl.appendChild(li);
            });
        }

        // ดึง API แผ่นดินไหว
        async function checkEarthquake() {
            setDialogue("กำลังดึงข้อมูลแผ่นดินไหวล่าสุด...", IMG_ALERT);
            try {
                const res = await fetch("https://earthquake.usgs.gov/fdsnws/event/1/query?format=geojson&limit=1");
                const data = await res.json();
                if (data.features && data.features.length > 0) {
                    const place = data.features[0].properties.place;
                    const mag = data.features[0].properties.mag;
                    setDialogue(`⚠️ รายงานแผ่นดินไหวล่าสุด: ขนาด ${mag} Mv ที่ ${place}`, IMG_ALERT);
                } else {
                    setDialogue("ไม่พบรายงานแผ่นดินไหวล่าสุดค่ะ", IMG_IDLE);
                }
            } catch (e) {
                setDialogue("ไม่สามารถดึงข้อมูลแผ่นดินไหวได้ในขณะนี้", IMG_IDLE);
            }
        }
    </script>
</body>
</html>
